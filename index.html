<script>
const INFO = {"greaterwill": {"name": "無上意志", "en": "Greater Will", "branch": "秩序層", "text": "把艾爾登之獸與法環送進交界地的外神，早已失聯，只剩雙指自稱還在代行它的意志。", "rel": ["eldenbeast", "marika"]}, "eldenbeast": {"name": "艾爾登之獸", "en": "Elden Beast", "branch": "秩序層．法環本體", "text": "乘流星而來，最後成為法環本身，棲在瑪莉卡體內。王座決戰的最後一戰，對手就是它。", "rel": ["greaterwill", "marika"]}, "godfrey": {"name": "葛孚雷", "en": "Godfrey", "branch": "黃金一族源頭", "text": "瑪莉卡的第一任丈夫、首任艾爾登之王，黃金一族的源頭。功成之後被放逐出交界地，成為第一個褪色者。", "rel": ["marika", "godwyn", "morgott", "mohg"]}, "marika": {"name": "瑪莉卡 ＝ 拉達岡", "en": "Marika / Radagon", "branch": "中心．女王與第二任王", "text": "同一個人，女王與第二任王，法環棲於其身。跟葛孚雷生下黃金一族、跟蕾娜菈生下卡利亞三名子女、跟自己生下雙胞胎；最後親手敲碎法環。", "rel": ["greaterwill", "eldenbeast", "godfrey", "rennala", "godwyn", "morgott", "mohg", "malenia", "miquella", "radahn", "rykard", "ranni", "melina"]}, "rennala": {"name": "蕾娜菈", "en": "Rennala", "branch": "卡利亞王室", "text": "滿月女王，魔法學院與卡利亞的主人。拉達岡離開她去當第二任王之後精神崩潰，抱著琥珀卵，停在被離開的那一刻。", "rel": ["marika", "radahn", "rykard", "ranni"]}, "godwyn": {"name": "葛德溫", "en": "Godwyn", "branch": "瑪莉卡跟葛孚雷一支．長子", "text": "黃金時代最被愛戴的王子，打完古龍戰爭還能跟龍結為朋友。黑刀之夜第一個被殺，只死靈魂、肉體不死，屍體沉在地底蔓延成死根。", "rel": ["godfrey", "marika", "morgott", "mohg", "ranni"]}, "morgott": {"name": "蒙葛特", "en": "Morgott", "branch": "瑪莉卡跟葛孚雷一支．惡兆雙子之兄", "text": "生來帶惡兆，在律法眼中是不潔，卻是全家最忠於律法的人。守在王座前面打每一個想進城的褪色者，他守的秩序從頭到尾沒有回應過他。", "rel": ["godfrey", "marika", "godwyn", "mohg"]}, "mohg": {"name": "蒙格", "en": "Mohg", "branch": "瑪莉卡跟葛孚雷一支．惡兆雙子之弟", "text": "選擇跟哥哥相反：他在地底接受外神無形之母，以血建立莫格溫王朝，要迎米凱拉為神、自己當君主。DLC 定性他受米凱拉魅惑，被利用的成分分不清。", "rel": ["godfrey", "marika", "morgott", "miquella"]}, "malenia": {"name": "瑪蓮妮亞", "en": "Malenia", "branch": "瑪莉卡跟拉達岡一支．雙胞胎之妹", "text": "出生帶猩紅腐敗，一生抵抗借住在她體內的外神。她自稱是米凱拉的劍，為哥哥守聖樹、等他回來；南下跟拉塔恩決戰時放開腐敗、開了花。", "rel": ["marika", "miquella", "radahn"]}, "miquella": {"name": "米凱拉", "en": "Miquella", "branch": "瑪莉卡跟拉達岡一支．雙胞胎之兄", "text": "出生帶永遠停在孩童的詛咒。黃金律法救不了兄妹倆，他離開律法，種聖樹收容被拋棄的人、做無垢金擋外神，最後消失在繭裡；成神的完整計畫由 DLC 補完。", "rel": ["marika", "malenia", "mohg", "radahn"]}, "radahn": {"name": "拉塔恩", "en": "Radahn", "branch": "拉達岡跟蕾娜菈一支．次子", "text": "崇拜葛孚雷與父親的將軍，為了繼續騎從小養大的瘦弱愛馬，去學了重力魔法。碎星一戰凍住群星，也凍住菈妮的命運；被瑪蓮妮亞的腐敗吃掉神智後，祭典是部下替他辦的送行。", "rel": ["rennala", "marika", "rykard", "ranni", "malenia", "miquella"]}, "rykard": {"name": "拉卡德", "en": "Rykard", "branch": "拉達岡跟蕾娜菈一支．長子", "text": "火山官邸之主，全家最極端的反叛者：自願被大蛇艾格雷吞食，要養出一條能吞食諸神的大蛇，自己在蛇的體內不死。", "rel": ["rennala", "marika", "radahn", "ranni"]}, "ranni": {"name": "菈妮", "en": "Ranni", "branch": "拉達岡跟蕾娜菈一支．小女兒", "text": "神人。她拒絕命運被雙指安排，策劃黑刀之夜，殺掉自己的肉身、把靈魂搬進人偶；要弒掉自己的雙指，帶著她的律法遠離地面。", "rel": ["rennala", "marika", "radahn", "rykard", "godwyn"]}, "melina": {"name": "梅琳娜", "en": "Melina", "branch": "未歸戶", "text": "在賜福旁跟褪色者立約的少女，替他引路、把盧恩換成力量，最後在巨人火爐自焚引火。她是瑪莉卡的女兒，父親文本未定，這張圖沒有替她畫線。", "rel": ["marika"]}, "dung": {"name": "食糞者", "en": "Dung Eater", "branch": "結局人物", "text": "囚於王城下水道牢籠的褪色者，以咒縛種子汙染死者，讓詛咒一代一代傳下去。他的修復符文通向絕望結局。", "rel": []}};
const card = document.getElementById('card');
function el(id){ return document.getElementById(id); }
function groups(pid){ return document.querySelectorAll('[data-pid="' + pid + '"]'); }
function reset(){
  document.querySelectorAll('.person').forEach(g=>g.classList.remove('rel','sel','dim'));
  card.classList.remove('show','mini'); card.setAttribute('aria-hidden','true');
  el('cardToggle').textContent = '收合';
}
function select(pid){
  const info = INFO[pid]; if(!info) return;
  document.querySelectorAll('.person').forEach(g=>g.classList.remove('rel','sel','dim'));
  card.classList.remove('mini'); el('cardToggle').textContent = '收合';
  groups(pid).forEach(g=>{ g.classList.add('sel'); g.parentNode.appendChild(g); });
  info.rel.forEach(r=>{ groups(r).forEach(g=>{ g.classList.add('rel'); g.parentNode.appendChild(g); }); });
  document.querySelectorAll('.person:not(.sel):not(.rel)').forEach(g=>g.classList.add('dim'));
  el('cardName').textContent = info.name;
  el('cardEn').textContent = info.en;
  el('cardBranch').textContent = info.branch;
  el('cardText').textContent = info.text;
  const relBox = el('cardRel'); relBox.innerHTML = '';
  el('cardRelLabel').style.display = info.rel.length ? '' : 'none';
  info.rel.forEach(r=>{
    const b = document.createElement('button');
    b.textContent = INFO[r].name;
    b.addEventListener('click', ()=>select(r));
    relBox.appendChild(b);
  });
  card.classList.add('show'); card.setAttribute('aria-hidden','false');
  if (window.innerWidth <= 860) {
    const narrow = document.getElementById('svgNarrow');
    const g = narrow.querySelector('[data-pid="' + pid + '"]');
    if (g) {
      const rect = g.getBoundingClientRect();
      window.scrollTo({ top: window.scrollY + rect.top - 64, behavior: 'smooth' });
    }
  }
}
document.querySelectorAll('.person').forEach(g=>{
  g.addEventListener('click', e=>{ e.stopPropagation(); select(g.dataset.pid); });
});
document.querySelectorAll('svg').forEach(s=>s.addEventListener('click', reset));
el('cardClose').addEventListener('click', reset);
el('cardToggle').addEventListener('click', ()=>{
  const mini = card.classList.toggle('mini');
  el('cardToggle').textContent = mini ? '展開' : '收合';
});
</script>
