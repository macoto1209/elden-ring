<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>《艾爾登法環》人物關係圖</title>
<style>
  body { margin:0; background:#ECE9E1; font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif; }
  .wrap { max-width:1720px; margin:0 auto; padding:18px; }
  svg { background:#FBFAF6; border:1px solid #D8D2C2; width:100%; height:auto; display:block; }
  .t { font-size:20px; font-weight:700; fill:#1C1B18; }
  .s { font-size:12.5px; fill:#6E6A61; }
  .cap { font-size:13px; fill:#8A8474; }
  .lab { font-size:12px; fill:#A87C2A; font-weight:700; }
  .box { fill:#FFFFFF; stroke:#C9BFA8; stroke-width:1.4; }
  .god { fill:#F5EDD8; stroke:#A87C2A; stroke-width:2.4; }
  .note { fill:#F3F0E7; stroke:#D8D2C2; stroke-width:1.2; }
  .ln { stroke:#9A927E; stroke-width:1.6; fill:none; }
  .red { fill:#A33327; }

  .person { cursor:pointer; transition: transform .25s ease; transform-box: fill-box; transform-origin: center; }
  .person:hover rect { stroke:#A87C2A; }
  .person.rel { transform: scale(1.12); }
  .person.sel rect { stroke:#A33327; stroke-width:3; }
  .hint { color:#6E6A61; font-size:13.5px; margin:0 2px 10px; }
  #card { position:fixed; right:18px; top:84px; width:302px; max-width:calc(100vw - 24px); background:#FFFFFF; border:1.5px solid #C9BFA8; border-radius:12px; box-shadow:0 10px 32px rgba(28,27,24,.22); padding:16px 18px 14px; opacity:0; transform:translateY(8px); pointer-events:none; transition:opacity .2s ease, transform .2s ease; z-index:20; }
  #card.show { opacity:1; transform:translateY(0); pointer-events:auto; }
  #cardClose { position:absolute; right:10px; top:8px; border:none; background:none; font-size:15px; color:#8A8474; cursor:pointer; padding:4px 6px; }
  #cardName { font-size:19px; font-weight:700; color:#1C1B18; }
  #cardEn { font-size:12.5px; color:#A87C2A; font-weight:700; margin-top:1px; }
  #cardBranch { display:inline-block; font-size:12px; color:#6E6A61; background:#F3F0E7; border:1px solid #D8D2C2; border-radius:20px; padding:2px 10px; margin:8px 0 9px; }
  #cardText { font-size:13.5px; line-height:1.75; color:#3A382F; margin:0 0 10px; }
  #cardRelLabel { font-size:12px; color:#8A8474; margin-bottom:6px; }
  #cardRel { display:flex; flex-wrap:wrap; gap:6px; }
  #cardRel button { font-family:inherit; font-size:12.5px; color:#1C1B18; background:#F5EDD8; border:1px solid #C9BFA8; border-radius:16px; padding:3px 11px; cursor:pointer; }
  #cardRel button:hover { border-color:#A87C2A; }
  @media (max-width: 760px) { #card { top:auto; bottom:12px; right:12px; left:12px; width:auto; } }
</style>
</head>
<body>
<div class="wrap">
<p class="hint">點任一人物方塊：旁邊會浮出他的小資訊，跟他有關的主要人物會稍微放大，點放大的人可以繼續跳過去。點圖上空白處復原。</p>
<svg id="chart" viewBox="0 0 1680 1060" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9A927E"/>
    </marker>
  </defs>

  <text x="840" y="52" text-anchor="middle" font-size="34" font-weight="700" fill="#1C1B18">《艾爾登法環》人物關係圖</text>
  <text x="840" y="82" text-anchor="middle" class="cap">家族、婚姻，與破碎戰爭的因果</text>

  <!-- 秩序層 -->
  <g class="person" id="p-greaterwill">
  <rect class="box" x="60" y="118" width="230" height="64"/>
  <text class="t" x="175" y="146" text-anchor="middle">無上意志</text>
  <text class="s" x="175" y="168" text-anchor="middle">外神．早已失聯</text>
  </g>
  <line class="ln" x1="290" y1="150" x2="392" y2="150" marker-end="url(#ar)"/>
  <g class="person" id="p-eldenbeast">
  <rect class="box" x="400" y="118" width="250" height="64"/>
  <text class="t" x="525" y="146" text-anchor="middle">艾爾登之獸</text>
  <text class="s" x="525" y="168" text-anchor="middle">乘流星而來．後成為法環</text>
  </g>
  <path class="ln" d="M650,150 H840 V200" marker-end="url(#ar)"/>
  <text class="lab" x="700" y="140">棲於女王體內</text>

  <!-- 中心 -->
  <g class="person" id="p-godfrey">
  <rect class="box" x="60" y="213" width="270" height="88"/>
  <text class="t" x="195" y="250" text-anchor="middle">葛孚雷</text>
  <text class="s" x="195" y="274" text-anchor="middle">首任艾爾登之王．後遭放逐</text>
  </g>

  <g class="person" id="p-marika">
  <rect class="god" x="590" y="213" width="500" height="88"/>
  <text x="840" y="252" text-anchor="middle" font-size="26" font-weight="700" fill="#1C1B18">瑪莉卡 ＝ 拉達岡</text>
  <text class="s" x="840" y="278" text-anchor="middle">同一個人．女王與第二任王．法環棲於其身</text>
  </g>

  <g class="person" id="p-rennala">
  <rect class="box" x="1350" y="213" width="270" height="88"/>
  <text class="t" x="1485" y="250" text-anchor="middle">蕾娜菈</text>
  <text class="s" x="1485" y="274" text-anchor="middle">滿月女王．卡利亞王室</text>
  </g>

  <line class="ln" x1="330" y1="257" x2="590" y2="257"/>
  <text class="lab" x="460" y="245" text-anchor="middle">第一段婚姻</text>
  <line class="ln" x1="1090" y1="257" x2="1350" y2="257"/>
  <text class="lab" x="1220" y="245" text-anchor="middle">結婚後又離開她</text>

  <!-- 子代 A -->
  <path class="ln" d="M460,257 V343 M140,343 H470 M140,343 V363 M310,343 V363 M470,343 V363"/>
  <g class="person" id="p-godwyn">
  <rect class="box" x="55" y="363" width="170" height="94"/>
  <text class="t" x="140" y="398" text-anchor="middle">葛德溫</text>
  <text class="s" x="140" y="420" text-anchor="middle">長子．黃金嫡系</text>
  <text class="s red" x="140" y="440" text-anchor="middle">黑刀之夜被殺</text>
  </g>
  <g class="person" id="p-morgott">
  <rect class="box" x="245" y="363" width="170" height="94"/>
  <text class="t" x="330" y="398" text-anchor="middle">蒙葛特</text>
  <text class="s" x="330" y="420" text-anchor="middle">惡兆．雙胞胎</text>
  <text class="s" x="330" y="440" text-anchor="middle">守護王城</text>
  </g>
  <g class="person" id="p-mohg">
  <rect class="box" x="435" y="363" width="170" height="94"/>
  <text class="t" x="520" y="398" text-anchor="middle">蒙格</text>
  <text class="s" x="520" y="420" text-anchor="middle">惡兆．雙胞胎</text>
  <text class="s" x="520" y="440" text-anchor="middle">鮮血王朝</text>
  </g>
  <text class="cap" x="330" y="484" text-anchor="middle">瑪莉卡與葛孚雷之子．惡兆生來被囚於王城下水道</text>

  <!-- 子代 C -->
  <path class="ln" d="M840,301 V343 M740,343 H930 M740,343 V363 M930,343 V363"/>
  <g class="person" id="p-malenia">
  <rect class="box" x="655" y="363" width="170" height="94"/>
  <text class="t" x="740" y="398" text-anchor="middle">瑪蓮妮亞</text>
  <text class="s" x="740" y="420" text-anchor="middle">受猩紅腐敗詛咒</text>
  <text class="s" x="740" y="440" text-anchor="middle">女武神</text>
  </g>
  <g class="person" id="p-miquella">
  <rect class="box" x="845" y="363" width="170" height="94"/>
  <text class="t" x="930" y="398" text-anchor="middle">米凱拉</text>
  <text class="s" x="930" y="420" text-anchor="middle">受永遠年幼詛咒</text>
  <text class="s" x="930" y="440" text-anchor="middle">聖樹的主人</text>
  </g>
  <text class="cap" x="840" y="484" text-anchor="middle">瑪莉卡與拉達岡（自己與自己）之雙胞胎</text>

  <!-- 子代 B -->
  <path class="ln" d="M1220,257 V343 M1160,343 H1540 M1160,343 V363 M1350,343 V363 M1540,343 V363"/>
  <g class="person" id="p-radahn">
  <rect class="box" x="1075" y="363" width="170" height="94"/>
  <text class="t" x="1160" y="398" text-anchor="middle">拉塔恩</text>
  <text class="s" x="1160" y="420" text-anchor="middle">碎星將軍</text>
  <text class="s" x="1160" y="440" text-anchor="middle">破碎戰爭名將</text>
  </g>
  <g class="person" id="p-rykard">
  <rect class="box" x="1265" y="363" width="170" height="94"/>
  <text class="t" x="1350" y="398" text-anchor="middle">拉卡德</text>
  <text class="s" x="1350" y="420" text-anchor="middle">火山官邸之主</text>
  <text class="s" x="1350" y="440" text-anchor="middle">自願被大蛇吞噬</text>
  </g>
  <g class="person" id="p-ranni">
  <rect class="box" x="1455" y="363" width="170" height="94"/>
  <text class="t" x="1540" y="398" text-anchor="middle">菈妮</text>
  <text class="s" x="1540" y="420" text-anchor="middle">神人．月之公主</text>
  <text class="s red" x="1540" y="440" text-anchor="middle">策劃黑刀之夜</text>
  </g>
  <text class="cap" x="1350" y="484" text-anchor="middle">拉達岡與蕾娜菈之子．蕾娜菈被離開後精神崩潰</text>

  <!-- 因果鏈 -->
  <text x="60" y="540" font-size="16" font-weight="700" fill="#A87C2A">因果鏈</text>
  <rect class="box" x="40" y="556" width="300" height="96"/>
  <text class="t" x="190" y="592" text-anchor="middle">黑刀之夜</text>
  <text class="s" x="190" y="614" text-anchor="middle">菈妮策劃．黑刀刺客</text>
  <text class="s" x="190" y="632" text-anchor="middle">持命定之死碎片行兇</text>
  <rect class="box" x="370" y="556" width="300" height="96"/>
  <text class="t" x="520" y="592" text-anchor="middle">葛德溫之死</text>
  <text class="s" x="520" y="614" text-anchor="middle">靈魂死而肉體不死</text>
  <text class="s" x="520" y="632" text-anchor="middle">成為死王子的源頭</text>
  <rect class="box" x="700" y="556" width="300" height="96"/>
  <text class="t" x="850" y="592" text-anchor="middle">法環破碎</text>
  <text class="s" x="850" y="614" text-anchor="middle">瑪莉卡親手敲碎</text>
  <text class="s" x="850" y="632" text-anchor="middle">拉達岡修補失敗</text>
  <rect class="box" x="1030" y="556" width="300" height="96"/>
  <text class="t" x="1180" y="592" text-anchor="middle">破碎戰爭</text>
  <text class="s" x="1180" y="614" text-anchor="middle">半神搶奪大盧恩</text>
  <text class="s" x="1180" y="632" text-anchor="middle">沒有人勝出</text>
  <rect class="box" x="1360" y="556" width="300" height="96"/>
  <text class="t" x="1510" y="592" text-anchor="middle">褪色者召回</text>
  <text class="s" x="1510" y="614" text-anchor="middle">恩惠指引放逐者</text>
  <text class="s" x="1510" y="632" text-anchor="middle">回到交界地</text>
  <line class="ln" x1="340" y1="604" x2="362" y2="604" marker-end="url(#ar)"/>
  <line class="ln" x1="670" y1="604" x2="692" y2="604" marker-end="url(#ar)"/>
  <line class="ln" x1="1000" y1="604" x2="1022" y2="604" marker-end="url(#ar)"/>
  <line class="ln" x1="1330" y1="604" x2="1352" y2="604" marker-end="url(#ar)"/>

  <!-- 旅程 -->
  <text x="60" y="706" font-size="16" font-weight="700" fill="#A87C2A">褪色者的旅程（主線）</text>
  <g class="person" id="p-melina">
  <rect class="box" x="40" y="722" width="300" height="96"/>
  <text class="t" x="190" y="758" text-anchor="middle">梅琳娜引路</text>
  <text class="s" x="190" y="780" text-anchor="middle">賜福旁的少女</text>
  <text class="s" x="190" y="798" text-anchor="middle">與褪色者立約</text>
  </g>
  <rect class="box" x="370" y="722" width="300" height="96"/>
  <text class="t" x="520" y="758" text-anchor="middle">收集大盧恩</text>
  <text class="s" x="520" y="780" text-anchor="middle">打倒碎片君王</text>
  <text class="s" x="520" y="798" text-anchor="middle">進入王城</text>
  <rect class="box" x="700" y="722" width="300" height="96"/>
  <text class="t" x="850" y="758" text-anchor="middle">燒掉黃金樹</text>
  <text class="s" x="850" y="780" text-anchor="middle">樹門荊棘拒人進入</text>
  <text class="s" x="850" y="798" text-anchor="middle">梅琳娜自焚引火</text>
  <rect class="box" x="1030" y="722" width="300" height="96"/>
  <text class="t" x="1180" y="758" text-anchor="middle">取回命定之死</text>
  <text class="s" x="1180" y="780" text-anchor="middle">法姆亞茲拉</text>
  <text class="s" x="1180" y="798" text-anchor="middle">殺黑劍瑪利喀斯</text>
  <rect class="box" x="1360" y="722" width="300" height="96"/>
  <text class="t" x="1510" y="758" text-anchor="middle">王座決戰</text>
  <text class="s" x="1510" y="780" text-anchor="middle">拉達岡與艾爾登之獸</text>
  <text class="s" x="1510" y="798" text-anchor="middle">修復法環．新王誕生</text>
  <line class="ln" x1="340" y1="770" x2="362" y2="770" marker-end="url(#ar)"/>
  <line class="ln" x1="670" y1="770" x2="692" y2="770" marker-end="url(#ar)"/>
  <line class="ln" x1="1000" y1="770" x2="1022" y2="770" marker-end="url(#ar)"/>
  <line class="ln" x1="1330" y1="770" x2="1352" y2="770" marker-end="url(#ar)"/>

  <!-- 註記 -->
  <rect class="note" x="40" y="856" width="520" height="86"/>
  <text class="t" x="66" y="890">命定之死</text>
  <text class="s" x="66" y="912">本是法環的一部分．瑪莉卡將它摘出，交瑪利喀斯保管</text>
  <text class="s" x="66" y="930">被偷走的碎片，造出了黑刀</text>
  <g class="person" id="p-dung">
  <rect class="note" x="580" y="856" width="520" height="86"/>
  <text class="t" x="606" y="890">食糞者</text>
  <text class="s" x="606" y="912">囚於王城下水道牢籠．以詛咒汙染死者</text>
  <text class="s" x="606" y="930">他的修復符文通向詛咒結局</text>
  </g>
  <rect class="note" x="1120" y="856" width="520" height="86"/>
  <text class="t" x="1146" y="890">星星時代（菈妮結局）</text>
  <text class="s" x="1146" y="912">不修法環．菈妮把秩序帶離這個世界</text>
  <text class="s" x="1146" y="930">褪色者隨她離開．秩序不再干涉地面</text>

  <text class="cap" x="60" y="1015">金框：神與法環　實線：血緣與婚姻　紅字：謀殺與策劃</text>
  <text class="cap" x="1620" y="1015" text-anchor="end">依遊戲本篇設定整理．推論部分未列入</text>
</svg>
</div>

<div id="card" aria-hidden="true">
  <button id="cardClose" title="關閉">✕</button>
  <div id="cardName"></div>
  <div id="cardEn"></div>
  <div id="cardBranch"></div>
  <p id="cardText"></p>
  <div id="cardRelLabel">關係人（點了直接跳過去）</div>
  <div id="cardRel"></div>
</div>

<script>
const INFO = {"greaterwill": {"name": "無上意志", "en": "Greater Will", "branch": "秩序層", "text": "把艾爾登之獸與法環送進交界地的外神，早已失聯，只剩雙指自稱還在代行它的意志。", "rel": ["eldenbeast", "marika"]}, "eldenbeast": {"name": "艾爾登之獸", "en": "Elden Beast", "branch": "秩序層．法環本體", "text": "乘流星而來，最後成為法環本身，棲在瑪莉卡體內。王座決戰的最後一戰，對手就是它。", "rel": ["greaterwill", "marika"]}, "godfrey": {"name": "葛孚雷", "en": "Godfrey", "branch": "黃金一族源頭", "text": "瑪莉卡的第一任丈夫、首任艾爾登之王，黃金一族的源頭。功成之後被放逐出交界地，成為第一個褪色者。", "rel": ["marika", "godwyn", "morgott", "mohg"]}, "marika": {"name": "瑪莉卡 ＝ 拉達岡", "en": "Marika / Radagon", "branch": "中心．女王與第二任王", "text": "同一個人，女王與第二任王，法環棲於其身。跟葛孚雷生下黃金一族、跟蕾娜菈生下卡利亞三名子女、跟自己生下雙胞胎；最後親手敲碎法環。", "rel": ["greaterwill", "eldenbeast", "godfrey", "rennala", "godwyn", "morgott", "mohg", "malenia", "miquella", "radahn", "rykard", "ranni", "melina"]}, "rennala": {"name": "蕾娜菈", "en": "Rennala", "branch": "卡利亞王室", "text": "滿月女王，魔法學院與卡利亞的主人。拉達岡離開她去當第二任王之後精神崩潰，抱著琥珀卵，停在被離開的那一刻。", "rel": ["marika", "radahn", "rykard", "ranni"]}, "godwyn": {"name": "葛德溫", "en": "Godwyn", "branch": "瑪莉卡跟葛孚雷一支．長子", "text": "黃金時代最被愛戴的王子，打完古龍戰爭還能跟龍結為朋友。黑刀之夜第一個被殺，只死靈魂、肉體不死，屍體沉在地底蔓延成死根。", "rel": ["godfrey", "marika", "morgott", "mohg", "ranni"]}, "morgott": {"name": "蒙葛特", "en": "Morgott", "branch": "瑪莉卡跟葛孚雷一支．惡兆雙子之兄", "text": "生來帶惡兆，在律法眼中是不潔，卻是全家最忠於律法的人。守在王座前面打每一個想進城的褪色者，他守的秩序從頭到尾沒有回應過他。", "rel": ["godfrey", "marika", "godwyn", "mohg"]}, "mohg": {"name": "蒙格", "en": "Mohg", "branch": "瑪莉卡跟葛孚雷一支．惡兆雙子之弟", "text": "選擇跟哥哥相反：他在地底接受外神無形之母，以血建立莫格溫王朝，要迎米凱拉為神、自己當君主。DLC 定性他受米凱拉魅惑，被利用的成分分不清。", "rel": ["godfrey", "marika", "morgott", "miquella"]}, "malenia": {"name": "瑪蓮妮雅", "en": "Malenia", "branch": "瑪莉卡跟拉達岡一支．雙胞胎之妹", "text": "出生帶猩紅腐敗，一生抵抗借住在她體內的外神。她自稱是米凱拉的劍，為哥哥守聖樹、等他回來；南下跟拉塔恩決戰時放開腐敗、開了花。", "rel": ["marika", "miquella", "radahn"]}, "miquella": {"name": "米凱拉", "en": "Miquella", "branch": "瑪莉卡跟拉達岡一支．雙胞胎之兄", "text": "出生帶永遠停在孩童的詛咒。黃金律法救不了兄妹倆，他離開律法，種聖樹收容被拋棄的人、做無垢金擋外神，最後消失在繭裡；成神的完整計畫由 DLC 補完。", "rel": ["marika", "malenia", "mohg", "radahn"]}, "radahn": {"name": "拉塔恩", "en": "Radahn", "branch": "拉達岡跟蕾娜菈一支．次子", "text": "崇拜葛孚雷與父親的將軍，為了繼續騎從小養大的瘦弱愛馬，去學了重力魔法。碎星一戰凍住群星，也凍住菈妮的命運；被瑪蓮妮雅的腐敗吃掉神智後，祭典是部下替他辦的送行。", "rel": ["rennala", "marika", "rykard", "ranni", "malenia", "miquella"]}, "rykard": {"name": "拉卡德", "en": "Rykard", "branch": "拉達岡跟蕾娜菈一支．長子", "text": "火山官邸之主，全家最極端的反叛者：自願被大蛇艾格雷吞食，要養出一條能吞食諸神的大蛇，自己在蛇的體內不死。", "rel": ["rennala", "marika", "radahn", "ranni"]}, "ranni": {"name": "菈妮", "en": "Ranni", "branch": "拉達岡跟蕾娜菈一支．小女兒", "text": "神人。她拒絕命運被雙指安排，策劃黑刀之夜，殺掉自己的肉身、把靈魂搬進人偶；要弒掉自己的雙指，帶著她的律法遠離地面。", "rel": ["rennala", "marika", "radahn", "rykard", "godwyn"]}, "melina": {"name": "梅琳娜", "en": "Melina", "branch": "未歸戶", "text": "在賜福旁跟褪色者立約的少女，替他引路、把盧恩換成力量，最後在巨人火爐自焚引火。她是瑪莉卡的女兒，父親文本未定，這張圖沒有替她畫線。", "rel": ["marika"]}, "dung": {"name": "食糞者", "en": "Dung Eater", "branch": "結局人物", "text": "囚於王城下水道牢籠的褪色者，以咒縛種子汙染死者，讓詛咒一代一代傳下去。他的修復符文通向絕望結局。", "rel": []}};
const svg = document.getElementById('chart');
const card = document.getElementById('card');
function el(id){ return document.getElementById(id); }
function reset(){
  document.querySelectorAll('.person').forEach(g=>g.classList.remove('rel','sel'));
  card.classList.remove('show'); card.setAttribute('aria-hidden','true');
}
function select(id){
  const info = INFO[id]; if(!info) return;
  reset();
  const self = el('p-'+id);
  self.classList.add('sel'); svg.appendChild(self);
  info.rel.forEach(r=>{
    const g = el('p-'+r);
    if(g){ g.classList.add('rel'); svg.appendChild(g); }
  });
  el('cardName').textContent = info.name;
  el('cardEn').textContent = info.en;
  el('cardBranch').textContent = info.branch;
  el('cardText').textContent = info.text;
  const relBox = el('cardRel'); relBox.innerHTML = '';
  el('cardRelLabel').style.display = info.rel.length ? '' : 'none';
  info.rel.forEach(r=>{
    const b = document.createElement('button');
    b.textContent = INFO[r].name;
    b.addEventListener('click', ()=>select(r));
    relBox.appendChild(b);
  });
  card.classList.add('show'); card.setAttribute('aria-hidden','false');
}
document.querySelectorAll('.person').forEach(g=>{
  g.addEventListener('click', e=>{ e.stopPropagation(); select(g.id.slice(2)); });
});
svg.addEventListener('click', reset);
el('cardClose').addEventListener('click', reset);
</script>
</body>
</html>
